[project]
name = "Lespy"
license-files = ["LICEN[CS]E*"]
version = "0.1.1"
authors = [{ name = "Natan Santos", email = "natansantosapps@gmail.com" }]
description = "A small and robust micro Python framework for building simple and solid web apps."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/natanfeitosa/lespy.git"
"Bug Tracker" = "https://github.com/natanfeitosa/lespy/issues"

[project.optional-dependencies]
test = ["pytest", "coverage"]

[tool.poetry]
packages = [{ include = "lespy" }]

[tool.poetry.dependencies]
python = "^3.9"
pyfunctools = "^0.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
mypy = "^1.15"
coverage = "^7.6"
mkdocs = { extras = ["i18n"], version = "^1.3.0" }
mkdocs-material = "^8.2.9"
ipython = "^8.2.0"
twine = "^4.0.0"
docutils = "^0.23"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
